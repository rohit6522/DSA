name: Java DSA CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile Java files
        run: |
          find . -name "*.java" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            javac "$file"
          done
